# Every corpus, every way: every step, a suite's own tests, type checks and traced tests after each
# fix, recorded as docs/RUNS.md's `Mega corpora` section. `--minus super` measures only the slow
# corpora it adds to `super`'s. The machine sizes it: each step starts once the CPUs and the memory
# it took in the last run are free (`sizing`); `cpus` and `memory` under `[run]` share out less. A
# stopped run carries on with `--resume FOLDER`.

[run]
label = "mega"
versions = ["dev"]
jobs = 4
at-once = 8
suite-seconds = 900 # the longest suite's tests take 6 minutes a run
options = ["--extend-select", "LVA014,LVA015"] # signatures in every fix step, and `traced` reads the returns

[corpora]
include = ["mega"]

[steps]
check = true
fix = ["certain", "likely", "unsafe"]
infer-with = ["basedpyright", "ty", "pyrefly"]
census = true
coverage = true
timing = 1
tests = true
types = true
traced = true

[publish]
runs-md = "docs/RUNS.md"
section = "Mega corpora"
