# The corpora added last (`corpora.toml`'s `alt`), every way, as mega runs them: every step, a
# suite's own tests, type checks and traced tests after each fix, recorded as
# docs/runs/alt-corpora.md. A first run of them meets each step unmeasured, planned by its like
# corpora (`planning.like`). A stopped run carries on with `--resume FOLDER`.

[run]
label = "alt"
versions = ["dev"]
jobs = 4
at-once = 8
suite-seconds = 900

[corpora]
include = ["alt"]

[steps]
check = true
fix = ["certain", "likely", "unsafe"]
infer-with = ["basedpyright", "ty", "pyrefly"]
census = true
coverage = true
timing = 1
timing-beside = true
tests = true
types = true
traced = true

[publish]
runs-md = "docs/RUNS.md"
section = "Alt corpora"
