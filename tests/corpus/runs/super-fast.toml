# The `super` corpora as `super.toml` measures them, faster: a suite's own tests run only after
# each fix, the tests as released taken from the latest earlier run at the suite's tag
# (`tests-released`; run where none has them), and no traced tests, so no fix by the trace. Not
# published: its fixes and tests aren't `super.toml`'s. A stopped run carries on with
# `--resume FOLDER`.

[run]
label = "super-fast"
versions = ["dev"]
jobs = 4
at-once = 7

[corpora]
include = ["super"]

[steps]
check = true
fix = ["certain", "likely", "unsafe"]
infer-with = ["basedpyright", "ty", "pyrefly"]
census = true
coverage = true
timing = 1
tests = true
types = true
traced = false
tests-released = false
