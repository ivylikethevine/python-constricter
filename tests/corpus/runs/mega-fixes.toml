# Every corpus's fixes and type checks alone, against the mega run at the same records: for a change
# to what `--fix` offers or refuses, read with `scratch/run_fixes_diff.py` against the latest mega run's
# records. No hints, census, timing, tests or traced tests. Not published.

[run]
label = "mega-fixes"
versions = ["dev"]
jobs = 4
at-once = 8

[corpora]
include = ["mega"]

[steps]
check = true
fix = ["certain", "likely", "unsafe"]
infer-with = []
census = false
coverage = false
timing = 0
profile = false
tests = false
types = true
traced = false
tests-released = false
