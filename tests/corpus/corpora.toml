sha256 = "d4d1afcfa7ca40a7da26832cba653851eb147a06bd3f7f6fae89af3d5cd295c6"
package = "Twisted-12.3.0/twisted"

# The last pip for Python 2 (MIT): 2/3-era code whose `# type:` comments sit in modules importing
