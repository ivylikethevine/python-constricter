# The corpora a run file can name (`python -m tests.corpus RUN.toml`), and the sets of them.
#
# [corpus.NAME]         `why` it's here, and its `version`. `environment`: what its commands need
#                       set, its install's too. `port`: the port its tests' own server binds (those
#                       of one port run one at a time). `alone`: why it has no suite here. `heavy`:
#                       its suite's tests hold more memory than a run's corpora can share, so no
#                       other suite runs beside them.
# [corpus.NAME.sdist]   its sdist, hash-pinned: on PyPI's file host, `where` (the directory under
#                       https://files.pythonhosted.org/packages) and `archive`, or elsewhere, `url`;
#                       its `sha256`, and `package`, the directory checked in it.
# [corpus.NAME.suite]   its own tests and type checks, read from its CI: the `repository` and `tag` to
#                       clone, its `source` there, and the `uv` commands that `install` it (`pip ...`
#                       for `uv pip install`, into a venv made first; `sync ...` for `uv sync`); its
#                       `tests` (pytest's arguments, or a whole command after `!`; `{workers}` stands
#                       for its processes) and type `checks`. `most`: the most processes its tests
#                       keep busy (8 where they take `{workers}`, else 1). `worker-memory`: the
#                       gigabytes one takes (1). `left-out`: requirements it can't build here.
#                       `submodules`: its build needs them. `script`: what runs its tests in one
#                       process, where pytest doesn't. `differs`: a table of the tests a fix may
#                       change the outcome of (or a file or a class of them), each with why; a
#                       run reports them apart, and a difference in these alone is none. `parts`: its tests' arguments, each
#                       part run after `tests` in a process of its own, their outcomes added up.
#
# A corpus with a suite is checked in its checkout, with its settings and environment; one with an
# sdist alone, in the unpacked sdist.

[sets]
seven = ["standard library", "django", "sqlalchemy", "pydantic", "pandas", "twisted", "pip"]
mega = [
  "black",
  "pdm",
  "tox",
  "sphinx",
  "mkdocs",
  "streamlink",
  "mypy",
  "httpx",
  "starlette",
  "uvicorn",
  "anyio",
  "websockets",
  "hypercorn",
  "aiohttp",
  "fastapi",
  "textual",
  "mcp",
  "pytest",
  "attrs",
  "werkzeug",
  "cattrs",
  "structlog",
  "xarray",
  "networkx",
  "pint",
  "dask",
  "zarr",
  "nibabel",
  "seaborn",
  "optuna",
  "altair",
  "stripe",
  "strawberry-graphql",
  "litestar",
  "narwhals",
  "click",
  "pygments",
  "celery",
  "botocore",
  "joblib",
]

# CPython's own source release (PSF-2.0), whose `Lib` has the `test` package a prebuilt Python
# leaves out: the same 1,867 files on any interpreter, so long as it parses 3.14's syntax.
[corpus."standard library"]
why = "the standard library with its tests"
version = "3.14.7"

[corpus."standard library".sdist]
url = "https://www.python.org/ftp/python/3.14.7/Python-3.14.7.tar.xz"
sha256 = "3b48dac8fb59f62eaa67ac83c1eb12bda1b7a08406dd286e252c11a66be27f81"
package = "Python-3.14.7/Lib"

# Its `runtests.py` on SQLite, its processes forked: with `forkserver`, Python 3.14's default on
# Linux, Django 5.2 can't clone a SQLite test database for each process. It has no type checker.
# pylibmc needs libmemcached's headers, and its tests need a memcached server, so they skip anyway.
[corpus.django]
why = "a framework with no annotations: the 5.2 LTS"
version = "5.2.17"

[corpus.django.suite]
repository = "https://github.com/django/django"
tag = "5.2.17"
source = "django"
install = ["pip -e . -r tests/requirements/py3.txt --excludes -"]
tests = "!python -Wall -c \"import multiprocessing, runpy, sys; multiprocessing.set_start_method('fork'); sys.argv[0] = 'tests/runtests.py'; sys.path.insert(0, 'tests'); runpy.run_path('tests/runtests.py', run_name='__main__')\" --parallel={workers}"
checks = []
most = 16
left-out = "pylibmc"
script = "tests/runtests.py --parallel=1"

# Its nox `github-cext-greenlet` session on SQLite (every SQLite driver, its C extensions built)
# and its `pep484` session (`mypy noxfile.py ./lib/sqlalchemy`, strict for the package).
[corpus.sqlalchemy]
why = "a typed library with generic classes of its own"
version = "2.0.54"

[corpus.sqlalchemy.suite]
repository = "https://github.com/sqlalchemy/sqlalchemy"
tag = "rel_2_0_54"
source = "lib/sqlalchemy"
install = ["pip -e . --group tests --group tests-sqlite-asyncio --group mypy"]
tests = "-n {workers} -m 'not memory_intensive and not mypy' --db sqlite --dbdriver sqlite --dbdriver pysqlite_numeric --dbdriver aiosqlite"
checks = ["mypy noxfile.py ./lib/sqlalchemy"]
most = 16

# Its CI's test job and linting job (`pyright pydantic`, its pre-commit typecheck hook); its tests
# of pydantic-core, its Rust core, which `--fix` doesn't touch, are left out.
[corpus.pydantic]
why = "a typed library on a compiled core"
version = "2.13.5"

[corpus.pydantic.suite]
repository = "https://github.com/pydantic/pydantic"
tag = "v2.13.5"
source = "pydantic"
install = ["sync --locked --all-packages --all-extras --group testing-extra --group linting"]
tests = "-p no:pretty --ignore=tests/pydantic_core"
checks = ["pyright pydantic"]

# Its CI's unit tests, `-m "not slow and not network and not single_cpu"` (about 190,000, a few
# minutes over four workers), with its required, build and test dependencies from its
# `requirements-dev.txt` (so the optional ones' tests skip; pytest 9 errors on 72 of its tests'
# parametrizations), and its type checkers as its pre-commit hooks pin them: its manual typing
# hooks, which its code-checks job runs. It's built in place, so its Python files are the checkout's.
[corpus.pandas]
why = "overloads, generics and `TYPE_CHECKING` imports, with its tests"
version = "3.0.6"

[corpus.pandas.suite]
repository = "https://github.com/pandas-dev/pandas"
tag = "v3.0.6"
source = "pandas"
install = [
  "pip 'meson-python>=0.17.1,<1' 'meson[ninja]>=1.2.1,<2' 'cython>=3.1.0,<4' 'numpy>=2.3.3,<3' 'versioneer[toml]' 'python-dateutil>=2.8.2' 'pytest>=8.3.4,<9' 'pytest-xdist>=3.6.1' 'hypothesis>=6.116.0' 'mypy==1.17.1' 'types-python-dateutil' 'pyright==1.1.404'",
  "pip --no-build-isolation -e .",
]
tests = "-n {workers} --dist=worksteal -m 'not slow and not network and not single_cpu' pandas"
checks = ["mypy", "pyright"]
most = 32
worker-memory = 1.5

# Twisted's last Python 2-only line (MIT): print statements, `except X, e`, tuple parameters and
