# The allowlist for typos, run by ci.yml's lint job. Each entry says what it
# is, so a real typo cannot hide behind a stale exception.
[default]
extend-ignore-re = [
  # A deliberate misspelling on one line takes a trailing
  # `# spellchecker: disable-line` (or `//`) comment rather than a
  # project-wide allowance.
  "(?Rm)^.*(#|//)\\s*spellchecker:\\s*disable-line$",
]

[files]
extend-exclude = [
  # Generated from typeshed: the standard library's own names (`os.spawnve`,
  # `smtplib.SMTP.helo`), not prose.
  "constricter/fix/tables/*.json",
  "tests/typeshed/partial.json",
]

[default.extend-words]
astroid = "astroid" # pylint's parser, a real package name
ND = "ND" # numpy's `NDArray`, named in the roadmap
