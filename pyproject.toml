[project]
name = "python-constricter"
dynamic = ["version"]
description = "Lint rules: every local variable is typed where it's first bound. A flake8 plugin, a pylint plugin and a standalone CLI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Ivy Duggan" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Framework :: Flake8",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.optional-dependencies]
flake8 = ["flake8>=7"]
pylint = ["pylint>=3"]

[dependency-groups]
# Locked with hashes in uv.lock (see README, Development).
dev = [
    "basedpyright",
    "build",
    "check-wheel-contents",
    "flake8>=7",
    "flit_core>=4.1,<5",
    "mypy",
    "pip-audit",
    "pre-commit",
    "pylint>=3",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
    "typos",
    "validate-pyproject",
    "zizmor",
]

[project.scripts]
constricter = "constricter.cli:main"

[project.entry-points."flake8.extension"]
LVA = "constricter.flake8_plugin:ConstricterChecker"

[build-system]
requires = ["flit_core>=4.1,<5"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "constricter"

[tool.ruff]
line-length = 110
indent-width = 2
target-version = "py311"
cache-dir = "local/.ruff_cache"

[tool.ruff.lint]
select = ["ALL"]
preview = true
ignore = [
    # Conflict with the formatter or with the D211/D212 conventions.
    "missing-trailing-comma",
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    # Assume 4-space indents (ruff says to disable them at any other width); flake8's E111/E114
    # check the 2-space width instead.
    "indentation-with-invalid-multiple",
    "indentation-with-invalid-multiple-comment",
]
external = ["LVA"]

[tool.ruff.lint.pydoclint]
# A one-line docstring needs no Returns/Yields section; a longer one does.
ignore-one-line-docstrings = true

[tool.ruff.lint.flake8-copyright]
# REUSE-IgnoreStart
notice-rgx = "SPDX-License-Identifier: MIT"
# REUSE-IgnoreEnd

[tool.ruff.lint.per-file-ignores]
# pytest's assert.
"tests/*" = ["assert"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.11"
cache_dir = "local/.mypy_cache"
strict = true
warn_unreachable = true
follow_untyped_imports = true
# astroid ships no annotations.
untyped_calls_exclude = ["astroid"]
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]

[tool.pylint.main]
py-version = "3.11"
load-plugins = [
    "constricter.pylint_plugin",
    "pylint.extensions.bad_builtin",
    "pylint.extensions.broad_try_clause",
    "pylint.extensions.code_style",
    "pylint.extensions.comparison_placement",
    "pylint.extensions.confusing_elif",
    "pylint.extensions.consider_refactoring_into_while_condition",
    "pylint.extensions.consider_ternary_expression",
    "pylint.extensions.dict_init_mutate",
    "pylint.extensions.docparams",
    "pylint.extensions.docstyle",
    "pylint.extensions.dunder",
    "pylint.extensions.empty_comment",
    "pylint.extensions.eq_without_hash",
    "pylint.extensions.for_any_all",
    "pylint.extensions.magic_value",
    "pylint.extensions.mccabe",
    "pylint.extensions.no_self_use",
    "pylint.extensions.overlapping_exceptions",
    "pylint.extensions.private_import",
    "pylint.extensions.redefined_loop_name",
    "pylint.extensions.redefined_variable_type",
    "pylint.extensions.set_membership",
    "pylint.extensions.typing",
    "pylint.extensions.while_used",
]

[tool.pylint.format]
max-line-length = 110
indent-string = "  "

[tool.typos.default.extend-words]
astroid = "astroid"

[tool.uv]
cache-dir = "local/.uv-cache"
required-version = ">=0.12.17"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = ["error"]
xfail_strict = true
cache_dir = "local/.pytest_cache"

[tool.coverage.run]
data_file = "local/.coverage"
source = ["constricter"]
branch = true

[tool.coverage.report]
fail_under = 100

[tool.basedpyright]
include = ["src", "tests"]
# The dev venv (see README, Development).
venvPath = "local"
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "all"
# astroid (pylint's AST) ships no annotations.
allowedUntypedLibraries = ["astroid"]
