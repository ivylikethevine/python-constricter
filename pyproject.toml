[project]
name = "python-constricter"
version = "0.1.0"
description = "Lint rule: every local variable is annotated where it's first bound. A flake8 plugin, a pylint plugin and a standalone CLI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Ivy Duggan" }]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Framework :: Flake8",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.optional-dependencies]
flake8 = ["flake8>=7"]
pylint = ["pylint>=3"]
dev = ["pytest", "pytest-cov", "flake8>=7", "pylint>=3", "ruff", "basedpyright"]

[project.scripts]
constricter = "constricter.cli:main"

[project.entry-points."flake8.extension"]
LVA = "constricter.flake8_plugin:ConstricterChecker"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
constricter = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py312"
cache-dir = "local/.ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ANN", "RUF"]
# The package's own rule: ruff doesn't know LVA001, so it mustn't flag or strip `# noqa: LVA001`.
external = ["LVA"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "local/.pytest_cache"

[tool.coverage.run]
data_file = "local/.coverage"
source = ["constricter"]

[tool.coverage.report]
fail_under = 95
exclude_also = ["if __name__ == .__main__.:", "except PackageNotFoundError:"]

[tool.basedpyright]
include = ["src", "tests"]
# The dev venv (see README, Development).
venvPath = "local"
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportPrivateUsage = false
reportUnusedFunction = false
# astroid (pylint's AST) ships no type information; only the pylint plugin imports it.
reportMissingTypeStubs = false
