[project]
name = "python-constricter"
dynamic = ["version"]
description = "Lint rules: every local variable is typed where it's first bound. A flake8 plugin, a pylint plugin and a standalone CLI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Ivy Duggan" }]
requires-python = ">=3.11"
import-names = ["constricter"]
dependencies = []
classifiers = [
    "Framework :: Flake8",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.optional-dependencies]
flake8 = ["flake8>=7"]
pylint = ["pylint>=3"]

[dependency-groups]
# Locked with hashes in uv.lock (see README, Development).
# What an editable install needs, with no build isolation: the build backend (and what it asks for
# an editable one), and the basedpyright whose typeshed stubs the standard-library tables are
# generated from (see hatch_build.py).
build = [
    "basedpyright",
    "editables",
    "hatchling>=1.27,<2",
]
# What the tests need: pure Python, so it installs on PyPy and free-threaded builds too.
test = [
    { include-group = "build" },
    "fastjsonschema", # validates the SARIF output against its schema
    "flake8>=7",
    "hypothesis",
    "pylint>=3",
    "pytest",
    "pytest-cov",
]
# A pinned, reproducible corpus of real code for tests/corpus/corpus.py and tests/corpus/corpus_fix.py to check
# and --fix, alongside the running interpreter's own standard library: a web framework, an ORM, a
# runtime-validation library and a data library, each a different style of real-world Python.
# Pure Python 2 code (Twisted 12.3.0) can't be installed on 3.11+: tests/corpus/corpus_sources.py fetches it.
corpus = [
    { include-group = "build" }, # for the setup action's editable `-e .` install
    "django==5.2.17", # 6.x needs Python 3.12+; 5.2 is the current LTS and still supports 3.11
    "pandas==3.0.6", # a large, partly annotated data library: overloads, generics, TYPE_CHECKING imports
    "pydantic==2.13.5",
    "sqlalchemy==2.0.54",
]
dev = [
    { include-group = "test" },
    "basedpyright",
    "build",
    "check-wheel-contents",
    "hypothesmith",
    "mypy",
    "pip-audit",
    "pre-commit",
    "ruff",
    "twine",
    "typos",
    "validate-pyproject",
    "zizmor",
]

[project.scripts]
constricter = "constricter.cli.command:main"

[project.entry-points."flake8.extension"]
LVA = "constricter.plugins.flake8:ConstricterChecker"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "constricter/__init__.py"

[tool.hatch.build]
# Generated where they're missing or stale (hatch_build.py), not tracked. `partial.json` is the tests',
# in the sdist only: a wheel built from it counts the tables current only with it there.
artifacts = ["constricter/fix/tables/*.json", "stdlib_tables/partial.json"]

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["constricter"]

[tool.hatch.build.targets.sdist]
# The generator too: a wheel built from the sdist checks the tables it carries are current.
only-include = ["constricter", "stdlib_tables", "hatch_build.py", "README.md", "LICENSE.md"]

[tool.constricter]
# Drafts for other projects (Trunk, conda-forge); Trunk's `basic.in.py` is untyped on purpose. The
# directory name skips it in a walk; the path glob, where a file's named (pre-commit names each).
exclude = ["upstream", "upstream/*"]

[tool.ruff]
line-length = 110
indent-width = 4
target-version = "py311"
cache-dir = "local/.ruff_cache"
# Drafts for other projects (Trunk, conda-forge), in their own formats; `basic.in.py` is untyped on purpose.
# `.claude/worktrees/`: other checkouts of this repository, made by Claude Code's agents.
extend-exclude = ["upstream", ".claude"]

[tool.ruff.lint]
select = ["ALL"]
preview = true
ignore = [
    # Conflict with the D211/D212 conventions.
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
]
external = ["LVA"]

[tool.ruff.lint.flake8-copyright]
# REUSE-IgnoreStart
notice-rgx = "SPDX-License-Identifier: MIT"
# REUSE-IgnoreEnd

[tool.ruff.lint.per-file-ignores]
# pytest's assert.
"tests/**" = ["assert"]
# The corpus table runs each constricter version under test as a subprocess.
"tests/corpus/corpus_table.py" = ["assert", "suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
# `--infer-with`'s tests start its guard and a fake server, and a constricter to kill.
"tests/cli/test_hints.py" = ["assert", "suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
"tests/corpus/corpus_suite.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true", "start-process-with-partial-path"]
# Hatchling's build hook interface: generating the tables needs neither the version nor the build data.
"hatch_build.py" = ["unused-method-argument"]
# The generator imports `constricter`'s modules without its `__init__`: its tests import it apart.
"tests/fix/test_stdlib_tables.py" = ["assert", "suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
# The census of what `--fix` can't type runs this checkout's constricter on each corpus.
"tests/corpus/corpus_untyped.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
# The local CI runner runs the workflow's own steps (and git) as subprocesses.
"tests/ci_local.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true", "start-process-with-partial-path"]
# Installed modules' reads are cached as pickles, written and read by constricter alone in the
# user's own cache directory.
"constricter/fix/installed.py" = ["suspicious-pickle-import", "suspicious-pickle-usage"]
# `--infer-with` starts the type checker's language server, from a fixed table of commands (and
# asks it its version, to see it runs).
"constricter/cli/{hints,guard,protocol}.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
# The generator's modules import `constricter`'s without its `__init__`, which loads the tables.
"stdlib_tables/__init__.py" = ["non-empty-init-module"]
"tests/corpus/corpus_sources.py" = ["suspicious-url-open-usage"] # downloads only its pinned https URLs
"tests/cli/test_cli.py" = ["suspicious-url-open-usage"] # fetches the SARIF schema from its pinned URL

[tool.mypy]
files = ["constricter", "stdlib_tables", "tests", "hatch_build.py"]
python_version = "3.11"
cache_dir = "local/.mypy_cache"
strict = true
warn_unreachable = true
follow_untyped_imports = true
# astroid and fastjsonschema (the SARIF test's validator) ship no annotations.
untyped_calls_exclude = ["astroid", "fastjsonschema"]
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]

[tool.pylint.main]
py-version = "3.11"
load-plugins = [
    "constricter.plugins.pylint",
    "pylint.extensions.bad_builtin",
    "pylint.extensions.broad_try_clause",
    "pylint.extensions.code_style",
    "pylint.extensions.comparison_placement",
    "pylint.extensions.confusing_elif",
    "pylint.extensions.consider_refactoring_into_while_condition",
    "pylint.extensions.consider_ternary_expression",
    "pylint.extensions.dict_init_mutate",
    "pylint.extensions.docparams",
    "pylint.extensions.docstyle",
    "pylint.extensions.dunder",
    "pylint.extensions.empty_comment",
    "pylint.extensions.eq_without_hash",
    "pylint.extensions.for_any_all",
    "pylint.extensions.magic_value",
    "pylint.extensions.mccabe",
    "pylint.extensions.no_self_use",
    "pylint.extensions.overlapping_exceptions",
    "pylint.extensions.private_import",
    "pylint.extensions.redefined_loop_name",
    "pylint.extensions.redefined_variable_type",
    "pylint.extensions.set_membership",
    "pylint.extensions.typing",
    "pylint.extensions.while_used",
]

[tool.pylint.format]
max-line-length = 110
indent-string = "    "

[tool.pylint.design]
# `_Scope` (checker.py) genuinely tracks 9 independent facts about a scope; splitting it into two
# objects just to fit under 7 would add indirection, not clarity.
max-attributes = 9

[tool.uv]
cache-dir = "local/.uv-cache"
required-version = ">=0.12.17"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = ["error"]
xfail_strict = true
cache_dir = "local/.pytest_cache"

[tool.coverage.run]
data_file = "local/.coverage"
source = ["constricter"]
branch = true

[tool.coverage.report]
fail_under = 100

# numpy (from the `corpus` group's pandas) is reached only through pytest's and hypothesis's
# type-checking imports, and its stubs use syntax newer than `python_version`: constricter never
# uses it.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true  # numpy ships `.pyi` stubs, which `follow_imports` alone doesn't cover

# What only basedpyright has: pyrightconfig.json, which both it and Pyright read, extends this.
[tool.basedpyright]
typeCheckingMode = "all"
# astroid (pylint's AST) and fastjsonschema (the SARIF test's validator) ship no annotations.
allowedUntypedLibraries = ["astroid", "fastjsonschema"]
