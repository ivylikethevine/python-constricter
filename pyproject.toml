[project]
name = "python-constricter"
version = "0.1.0"
description = "Lint rule: every local variable is annotated where it's first bound. A flake8 plugin, a pylint plugin and a standalone CLI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Ivy Duggan" }]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Framework :: Flake8",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.optional-dependencies]
flake8 = ["flake8>=7"]
pylint = ["pylint>=3"]
# Locked with hashes in requirements-dev.txt (see README, Development).
dev = [
    "basedpyright",
    "build",
    "flake8>=7",
    "flit_core>=4.1,<5",
    "pip-audit",
    "pre-commit",
    "pylint>=3",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
    "zizmor",
]

[project.scripts]
constricter = "constricter.cli:main"

[project.entry-points."flake8.extension"]
LVA = "constricter.flake8_plugin:ConstricterChecker"

[build-system]
requires = ["flit_core>=4.1,<5"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "constricter"

[tool.ruff]
line-length = 110
target-version = "py312"
cache-dir = "local/.ruff_cache"

[tool.ruff.lint]
select = ["ALL"]
# D1: docstrings stay optional. CPY001: no headers. COM812, D203, D213: conflict with the formatter/D211/D212.
ignore = ["D1", "CPY001", "COM812", "D203", "D213"]
external = ["LVA"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "PLR2004", "INP001"]
"src/constricter/cli.py" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = ["error"]
xfail_strict = true
cache_dir = "local/.pytest_cache"

[tool.coverage.run]
data_file = "local/.coverage"
source = ["constricter"]
branch = true

[tool.coverage.report]
fail_under = 100
exclude_also = ["if __name__ == .__main__.:", "except PackageNotFoundError:"]

[tool.basedpyright]
include = ["src", "tests"]
# The dev venv (see README, Development).
venvPath = "local"
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "all"
reportPrivateUsage = false
reportUnusedFunction = false
# astroid (pylint's AST) ships no type information; only the pylint plugin imports it.
reportMissingTypeStubs = false
