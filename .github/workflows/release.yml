name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build
    needs: ci
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      id-token: write # sign the attestation
      attestations: write # store the attestation

  publish:
    name: PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/python-constricter
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # The v0.2.2 and v0.2.3 release runs' hosts: the artifact download, the publish action's
          # container image, the OIDC token PyPI trusts, Sigstore (the PEP 740 attestations) and
          # the upload itself.
          allowed-endpoints: >
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            upload.pypi.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            *.actions.githubusercontent.com:443
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release (and generate its notes)
      pull-requests: read # each merged pull request's `## Release note` section
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # The checkout, the artifact download, the generated notes and the pull requests they
          # list, then `gh release create` and its asset uploads.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            *.actions.githubusercontent.com:443
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{dist,attestation}"
          path: assets
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            README.md
            .github/scripts/release_notes.sh
          sparse-checkout-cone-mode: false
      # The README's badges head the release page, above the generated notes: the block of them
      # under its title, each relative link (a file, or a heading's #anchor) made absolute at this
      # tag, since a release page resolves none.
      - name: Take the README's badges
        run: |
          awk '/^\[!\[/ { print; seen = 1; next } seen { exit }' README.md | sed -E \
            -e "s#\]\(\#([^)]*)\)#](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/README.md\#\1)#g" \
            -e "s#\]\(([^):\#][^):]*)\)#](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/\1)#g" \
            > badges.md
          test -s badges.md
      # Below the badges, "What changed": each merged pull request's `## Release note` section
      # (release_notes.sh, empty if none says anything), then the generated list of them, grouped
      # by .github/release.yml.
      - name: Write the notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > generated.md
          bash .github/scripts/release_notes.sh "$GITHUB_REPOSITORY" generated.md > changed.md
          {
            cat badges.md
            echo
            if [ -s changed.md ]; then cat changed.md; echo; fi
            cat generated.md
          } > notes.md
      - name: Create the release from the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" assets/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
