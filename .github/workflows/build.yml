name: Build

# The release's build: a reusable workflow, so its attestation meets SLSA v1 Build Level 3. Verify
# with `gh attestation verify <file> --repo ivylikethevine/python-constricter
# --signer-workflow ivylikethevine/python-constricter/.github/workflows/build.yml`.
on:
  workflow_call:

permissions: {}

jobs:
  build:
    name: Build and attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # sign the attestation
      attestations: write # store the attestation
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          # The v0.2.2 and v0.2.3 release runs' hosts: uv and the dev wheels (setup), the
          # attestation's OIDC token and Sigstore signing, and the artifact upload.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            *.actions.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/build
      - name: Tag matches the package version
        run: test -f "dist/python_constricter-${GITHUB_REF_NAME#v}.tar.gz"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attestation
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error

  # A compiled wheel (mypyc; `[tool.hatch.build.targets.wheel.hooks.mypyc]`) for each platform and
  # CPython 3.11 to 3.14, from the sdist above, by cibuildwheel (manylinux on Linux; musllinux takes
  # the pure wheel). Built without isolation, from the `mypyc` dependency group, hash-checked from
  # uv.lock as `mypyc.txt`, which the sdist carries (cibuildwheel unpacks the sdist and builds in
  # it, so `{project}` is that directory, not this checkout); each wheel then imports its compiled
  # modules, and is attested here.
  compiled:
    name: Compiled wheels (${{ matrix.os }})
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # sign the attestation
      attestations: write # store the attestation
    steps:
      # block on Linux; macOS and Windows audit until each has an allowlist from its audit runs.
      # The hosts: the build's artifact, cibuildwheel, its manylinux images and its release
      # downloads (github.com redirects them to objects.githubusercontent.com), the hash-checked
      # build dependencies, Sigstore and the attestation.
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        if: runner.os == 'Linux'
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            quay.io:443
            cdn01.quay.io:443
            cdn02.quay.io:443
            cdn03.quay.io:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            *.actions.githubusercontent.com:443
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        if: runner.os != 'Linux'
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - id: sdist
        shell: bash
        run: echo "path=$(ls dist/*.tar.gz)" >> "$GITHUB_OUTPUT"
      - uses: pypa/cibuildwheel@adba99c781d3746d38b3a09b1cf797965bcb7fe6 # v4.3.0
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
          output-dir: wheelhouse
        env:
          CIBW_BUILD: cp311-* cp312-* cp313-* cp314-*
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_MACOS: native
          CIBW_ENVIRONMENT: HATCH_BUILD_HOOK_ENABLE_MYPYC=1
          CIBW_BUILD_FRONTEND: "build; args: --no-isolation"
          CIBW_BEFORE_BUILD: python -m pip install --require-hashes --no-deps -r {project}/mypyc.txt
          CIBW_TEST_COMMAND: >-
            python -c "import constricter.rules.checker as c; assert not c.__file__.endswith('.py'), c.__file__"
            && constricter --version
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: wheelhouse/*.whl
      - shell: bash
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          OS: ${{ matrix.os }}
        run: cp "$BUNDLE" "attestation-compiled-$OS.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiled-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attestation-compiled-${{ matrix.os }}
          path: attestation-compiled-${{ matrix.os }}.jsonl
          if-no-files-found: error
