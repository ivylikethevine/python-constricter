name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: basedpyright
      - run: mypy
      - run: pylint src tests
      - run: flake8 src tests
      - run: typos
      - run: validate-pyproject pyproject.toml
      - run: uv lock --check
      - run: constricter --level=suffocate --all-scopes --format=github src tests
      - run: constricter --coverage --all-scopes --fail-under=100 src tests
      - run: pre-commit try-repo . constricter --all-files

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # markdownlint-cli2 and prettier, locked in .github/package-lock.json.
      - run: npm ci --prefix .github
      - run: git ls-files -z '*.md' | xargs -0 .github/node_modules/.bin/markdownlint-cli2
      - run: git ls-files -z '*.md' | xargs -0 .github/node_modules/.bin/prettier --check
      - uses: $/.github/actions/tool
        with:
          url: https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          sha256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
          binary: lychee-x86_64-unknown-linux-gnu/lychee
      # Relative links and #fragments only; the weekly Security run checks external links.
      - run: git ls-files -z '*.md' | xargs -0 "$RUNNER_TEMP/bin/lychee" --offline --include-fragments --no-progress

  action:
    name: Action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The repository's own action, run on its own code.
      - uses: ./ # zizmor: ignore[self-repository] actionlint rejects a bare `$/` (no path)
        with:
          args: --level=suffocate --all-scopes --format=github src tests

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        group: [dev]
        include:
          - {os: ubuntu-latest, python: pypy3.11, group: test}
          - {os: ubuntu-latest, python: 3.14t, group: test}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Linux only: macOS and Windows reach OS hosts no allowlist can predict.
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        if: runner.os == 'Linux'
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
            files.pythonhosted.org:443
            downloads.python.org:443
            release-assets.githubusercontent.com:443
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        if: runner.os != 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          python-version: ${{ matrix.python }}
          group: ${{ matrix.group }}
      # Coverage on CPython 3.12+ with every dev tool: 3.11 can't reach the branch for `type X = ...`
      # statements, and the test group has no hypothesmith, so the fuzz tests are skipped there.
      - run: python -m pytest ${COVERAGE:+"$COVERAGE"}
        env:
          COVERAGE: ${{ matrix.group == 'dev' && matrix.python != '3.11' && '--cov' || '' }}

  build:
    name: Build
    needs: [lint, docs, test, action]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            files.pythonhosted.org:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - uses: $/.github/actions/build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-dist # release.yml's build uploads `dist`
          path: dist/
          if-no-files-found: error
