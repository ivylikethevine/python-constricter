name: CI

on:
  push:
    branches: [main]
  # Drafts run nothing (each job's `if`) until marked ready: ready_for_review
  # isn't a default type, and converted_to_draft cancels the in-flight run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

defaults:
  run:
    shell: bash

jobs:
  # CI already passed on this exact tree (a merge to main with nothing else in it, or the release
  # tag on that merge): every job below is skipped, which a required check counts as passing. Only
  # this repository's own successful runs of this workflow count: a fork's pull request runs its own
  # copy of it. Any change at all, to the code, the tests or this file, is a new tree.
  reuse:
    name: Reuse
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # find an earlier run's tested-tree artifact
      contents: read # read the commit's tree
    outputs:
      tested: ${{ steps.find.outputs.tested }}
      tree: ${{ steps.find.outputs.tree }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
          SHA: ${{ github.sha }}
        run: |
          tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha)
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          tested=false
          runs=$(gh api "repos/$REPO/actions/artifacts?name=tested-tree-$tree&per_page=20" \
            --jq ".artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == $REPO_ID) | .workflow_run.id" || true)
          for run in $runs; do
            if gh api "repos/$REPO/actions/runs/$run" \
              --jq '.conclusion == "success" and .path == ".github/workflows/ci.yml"' | grep -qx true; then
              tested=true
              echo "CI passed on tree $tree in run $run: reusing it." >> "$GITHUB_STEP_SUMMARY"
              break
            fi
          done
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: reuse
    if: github.event.pull_request.draft != true && needs.reuse.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: basedpyright
      - run: mypy
      - run: pylint constricter tests
      - run: flake8 constricter tests
      - run: typos
      - run: validate-pyproject pyproject.toml
      - run: uv lock --check
      # The standard-library tables are generated from the pinned basedpyright's typeshed stubs.
      - run: python -m tests.typeshed.stdlib_tables --check
      - run: constricter --level=suffocate --all-scopes --format=github constricter tests
      - run: constricter --coverage --all-scopes --fail-under=100 constricter tests
      - run: pre-commit try-repo . constricter --all-files

  docs:
    name: Docs
    needs: reuse
    if: github.event.pull_request.draft != true && needs.reuse.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # markdownlint-cli2 and prettier, locked in .github/package-lock.json.
      - run: npm ci --prefix .github
      - run: git ls-files -z '*.md' | xargs -0 .github/node_modules/.bin/markdownlint-cli2
      - run: git ls-files -z '*.md' | xargs -0 .github/node_modules/.bin/prettier --check
      - uses: ./.github/actions/tool
        with:
          url: https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          sha256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
          binary: lychee-x86_64-unknown-linux-gnu/lychee
      # Relative links and #fragments only; the weekly Security run checks external links.
      - run: git ls-files -z '*.md' | xargs -0 "$RUNNER_TEMP/bin/lychee" --offline --include-fragments --no-progress

  action:
    name: Action
    needs: reuse
    if: github.event.pull_request.draft != true && needs.reuse.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The repository's own action, run on its own code (with the summary table on the run page).
      - uses: ./
        id: constricter
        with:
          args: --level=suffocate --all-scopes --format=github constricter tests
      # Its SARIF log: there, and as clean as the check.
      - env:
          SARIF: ${{ steps.constricter.outputs.sarif-file }}
        run: jq -e '.version == "2.1.0" and (.runs[0].results | length) == 0' "$SARIF"
      # The latest release from PyPI, installed with uv.
      - uses: ./
        with:
          version: 0.2.3
          summary: "false"
          args: --level=suffocate --all-scopes --format=github constricter tests

  corpus:
    name: Corpus (${{ matrix.package }})
    needs: reuse
    if: github.event.pull_request.draft != true && needs.reuse.outputs.tested != 'true'
    strategy:
      fail-fast: false
      matrix:
        package: [stdlib, django, sqlalchemy, pydantic, pandas, twisted, pip]
    runs-on: ubuntu-latest
    timeout-minutes: 20 # the standard library's profile, in one process, takes minutes
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: "3.12" # the `corpus` group's django needs 3.12+
          group: corpus
      # Against the runner's standard library, or one pinned real package (`pyproject.toml`'s
      # `corpus` group: a web framework, an ORM, a runtime-validation library, a data library), or
      # pure
      # Python 2 (Twisted 12.3.0) and pip 20.3.4's 2/3-era type comments, hash-pinned sdists
      # tests/corpus/corpus_sources.py fetches (neither installs as a dependency): no crashes or slowdowns
      # (corpus.py), and `--fix` doesn't break any file or leave anything for a second pass
      # (corpus_fix.py).
      - name: Find the package's path
        id: target
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          if [ "$PACKAGE" = stdlib ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          elif [ "$PACKAGE" = twisted ] || [ "$PACKAGE" = pip ]; then
            echo "path=$(python tests/corpus/corpus_sources.py "$PACKAGE")" >> "$GITHUB_OUTPUT"
          else
            echo "path=$(python -c "import $PACKAGE, os; print(os.path.dirname($PACKAGE.__file__))")" >> "$GITHUB_OUTPUT"
          fi
      - run: python tests/corpus/corpus.py ${TARGET_PATH:+"$TARGET_PATH"}
        env:
          TARGET_PATH: ${{ steps.target.outputs.path }}
      - run: python tests/corpus/corpus_fix.py ${TARGET_PATH:+"$TARGET_PATH"}
        env:
          TARGET_PATH: ${{ steps.target.outputs.path }}
      # Where constricter's own time goes (corpus_profile.py): its slowest modules and functions, in
      # the job's summary, and the profile itself, kept for `python -m pstats` or snakeviz.
      - name: Profile
        run: python tests/corpus/corpus_profile.py ${TARGET_PATH:+"$TARGET_PATH"} >> "$GITHUB_STEP_SUMMARY"
        env:
          TARGET_PATH: ${{ steps.target.outputs.path }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-${{ matrix.package }}
          path: local/profile/
          if-no-files-found: error

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.python }})
    needs: reuse
    if: github.event.pull_request.draft != true && needs.reuse.outputs.tested != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        group: [dev]
        include:
          - {os: ubuntu-latest, python: pypy3.11, group: test}
          - {os: ubuntu-latest, python: 3.14t, group: test}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Linux only: macOS and Windows reach OS hosts no allowlist can predict. pypi.org: setup-python
      # upgrades pip when it downloads an interpreter the runner image lacks (3.14t).
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        if: runner.os == 'Linux'
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
            files.pythonhosted.org:443
            downloads.python.org:443
            release-assets.githubusercontent.com:443
            pypi.org:443
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        if: runner.os != 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}
          group: ${{ matrix.group }}
      # Coverage on CPython 3.12+ with every dev tool: 3.11 can't reach the branch for `type X = ...`
      # statements, and the test group has no hypothesmith, so the fuzz tests are skipped there.
      - run: python -m pytest ${COVERAGE:+"$COVERAGE"}
        env:
          COVERAGE: ${{ matrix.group == 'dev' && matrix.python != '3.11' && '--cov' || '' }}

  build:
    name: Build
    needs: [lint, docs, test, action, corpus]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            files.pythonhosted.org:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-dist # release.yml's build uploads `dist`
          path: dist/
          if-no-files-found: error

  # Everything passed on this tree: record it, for a later run on the same tree to reuse.
  tested:
    name: Tested
    needs: [reuse, lint, docs, action, corpus, test, build]
    if: needs.reuse.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
      - env:
          TREE: ${{ needs.reuse.outputs.tree }}
        run: echo "$TREE" > tested-tree.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-tree-${{ needs.reuse.outputs.tree }}
          path: tested-tree.txt
          retention-days: 90
          if-no-files-found: error
