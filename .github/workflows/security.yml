name: Security

# The repository's own security gates: the workflow audit, the dependency audits, dependency review
# and the secrets scan. CodeQL runs from codeql.yml and the weekly external link check from
# link-check.yml, both shared. Every tool here is a tools.txt row (sha256-verified, cached,
# drift-checked by tool-versions.yml).

on:
  push:
    branches: [main]
  # Drafts run nothing (each job's `if`) until marked ready: ready_for_review
  # isn't a default type, and converted_to_draft cancels the in-flight run.
  pull_request:
    branches: [main, dev] # dev: the sync PRs' commits are graded by this PR
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: '0 6 * * 1' # advisories and leaked secrets land without a push here

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Workflow audit
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # the checkout, zizmor's online audits, the tool downloads and their cache
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # zizmor at the version the shared workflows' ignores hold on
      - uses: ./.github/actions/setup-tools
        with:
          tools: zizmor actionlint
      - run: zizmor --persona pedantic .github/
        env:
          GH_TOKEN: ${{ github.token }}
      - run: actionlint
      # the conventions neither zizmor nor actionlint has a rule for (timeouts, checkout
      # credentials, top-level permissions, SHA pins, harden-runner first); yq and jq are on the runner
      - run: .github/scripts/lint_workflows.sh

  dependencies:
    name: Dependency audit
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # uv and the Python tools; osv-scanner's download and cache, and api.osv.dev for its advisories
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            pypi.org:443
            files.pythonhosted.org:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            api.osv.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: uv export --locked --no-emit-project --format requirements-txt --quiet -o local/audit.txt
      - run: pip-audit --strict --require-hashes --disable-pip -r local/audit.txt
      # Every lockfile git keeps, as Scorecard's Vulnerabilities check reads them after a merge, run
      # before one; an osv-scanner.toml beside a lockfile (.github's) accepts the advisories it lists.
      - uses: ./.github/actions/setup-tool
        with:
          tool: osv-scanner
      - run: osv-scanner scan source --recursive .

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.deps.dev:443
            api.securityscorecards.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low

  secrets:
    name: Secrets
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # the checkout, gitleaks' download and its cache
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history
      - uses: ./.github/actions/setup-tool
        with:
          tool: gitleaks
      - run: gitleaks git --redact --no-banner --exit-code 1 .
