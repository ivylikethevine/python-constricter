name: Build
description: Build the sdist and wheel into dist/, check them, and smoke-test the wheel (after ./setup).
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # What a compiled wheel's build installs before it (build.yml's cibuildwheel step, which
        # builds in the unpacked sdist): the `mypyc` group, hash-checked, carried by the sdist.
        uv export --locked --only-group mypyc --no-emit-project --format requirements.txt --output-file mypyc.txt
        python -m build --no-isolation --outdir dist
        twine check --strict dist/*
        check-wheel-contents dist/*.whl
        python -m venv "$RUNNER_TEMP/smoke"
        "$RUNNER_TEMP/smoke/bin/pip" install --no-deps --no-index dist/*.whl
        "$RUNNER_TEMP/smoke/bin/constricter" constricter
