name: Build
description: Build the sdist and wheel into dist/, check them, and smoke-test the wheel (after ./setup).
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        python -m build --no-isolation --outdir dist
        twine check --strict dist/*
        check-wheel-contents dist/*.whl
        python -m venv "$RUNNER_TEMP/smoke"
        "$RUNNER_TEMP/smoke/bin/pip" install --no-deps --no-index dist/*.whl
        "$RUNNER_TEMP/smoke/bin/constricter" constricter
        # Every symbol the wheel exports has a known type. `--verifytypes` reads the package of the
        # `python` first on PATH (it ignores `--pythonpath` and a venv config): the smoke venv's, from
        # outside the checkout, with the dev venv's packages behind it for the plugins' bases (pylint's,
        # flake8's). A score under 100% fails; basedpyright exits 0 whatever it is.
        python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])' > "$("$RUNNER_TEMP/smoke/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')/dev.pth"
        env -C "$RUNNER_TEMP" PATH="$RUNNER_TEMP/smoke/bin:$PATH" basedpyright --verifytypes constricter --ignoreexternal --outputjson > "$RUNNER_TEMP/verifytypes.json" || true
        python -c 'import json, sys; score = json.load(open(sys.argv[1]))["typeCompleteness"]["completenessScore"]; print(f"type completeness {score:.1%}"); sys.exit(score < 1)' "$RUNNER_TEMP/verifytypes.json"
