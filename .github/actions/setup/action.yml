name: Setup
description: Python and the dev environment locked in uv.lock, in local/.venv and on PATH.
inputs:
  python-version:
    description: The Python version.
    default: "3.11"
  group:
    description: The dependency group to install (`test` for interpreters without every dev tool's wheels).
    default: dev
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      id: python
      with:
        python-version: ${{ inputs.python-version }}
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: "0.13.1"
        enable-cache: false
    - shell: bash
      env:
        UV_PROJECT_ENVIRONMENT: local/.venv
        UV_PYTHON: ${{ steps.python.outputs.python-path }}
        UV_PYTHON_DOWNLOADS: never
        GROUP: ${{ inputs.group }}
      run: |
        # Wheels only: nothing built from unpinned sources.
        uv sync --locked --no-install-project --no-build --only-group "$GROUP"
        uv pip install --python local/.venv --no-deps --no-build-isolation -e .
        bin=local/.venv/bin
        [ -d "$bin" ] || bin=local/.venv/Scripts
        (cd "$bin" && { pwd -W 2>/dev/null || pwd; }) >> "$GITHUB_PATH"
