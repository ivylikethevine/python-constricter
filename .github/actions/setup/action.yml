name: Setup
description: Python and the dev environment locked in uv.lock, in local/.venv and on PATH.
inputs:
  python-version:
    description: The Python version.
    default: "3.11"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      id: python
      with:
        python-version: ${{ inputs.python-version }}
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.12.17"
        enable-cache: false
    - shell: bash
      env:
        UV_PROJECT_ENVIRONMENT: local/.venv
        UV_PYTHON: ${{ steps.python.outputs.python-path }}
        UV_PYTHON_DOWNLOADS: never
      run: |
        uv sync --locked --no-install-project --no-build # wheels only: nothing built from unpinned sources
        uv pip install --python local/.venv --no-deps --no-build-isolation -e .
        bin=local/.venv/bin
        [ -d "$bin" ] || bin=local/.venv/Scripts
        (cd "$bin" && { pwd -W 2>/dev/null || pwd; }) >> "$GITHUB_PATH"
