name: Setup
description: Python and the hash-locked dev environment in local/.venv, put on PATH.
inputs:
  python-version:
    description: The Python version.
    default: "3.12"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
    - shell: bash
      run: |
        python -m venv local/.venv
        bin=local/.venv/bin
        [ -d "$bin" ] || bin=local/.venv/Scripts
        "$bin/python" -m pip install --require-hashes -r requirements-dev.txt
        "$bin/python" -m pip install --no-deps --no-build-isolation -e .
        (cd "$bin" && { pwd -W 2>/dev/null || pwd; }) >> "$GITHUB_PATH"
