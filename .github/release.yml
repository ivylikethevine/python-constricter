# Groups for the release notes GitHub generates (release.yml's last job, under each pull request's own note).
changelog:
  exclude:
    authors: [dependabot]
  categories:
    - title: Rules
      labels: [rules]
    - title: Fixes
      labels: [bug]
    - title: CI and tooling
      labels: [ci, dependencies]
    - title: Other changes
      labels: ["*"]
